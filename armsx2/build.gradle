plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.armsx2'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        minSdk 26
        ndk {
            abiFilters 'arm64-v8a'
        }
        buildConfigField 'boolean', 'STORAGE_ALL_FILES', 'true'
        buildConfigField 'String', 'VERSION_NAME', '"2.6.8"'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // All native .so files for the PS2 core are NOT bundled into the APK.
    // They ship inside the Retro-Consoles bundle under `data/armsx2/jniLibs/`
    // and are extracted at runtime, then loaded directly via System.load
    // (see Armsx2Bootstrap). Drop the jniLibs source set so they are no
    // longer packaged.
    sourceSets {
        main {
            jniLibs.srcDirs = []
        }
    }

}

dependencies {
    implementation project(':framegen')
    implementation libs.coreKtx
    implementation libs.appcompat
    implementation libs.material

    implementation platform(libs.composeBom)
    implementation libs.activityCompose
    implementation libs.composeMaterial3
    implementation libs.composeUi
    implementation libs.composeUiGraphics
    implementation libs.composeFoundation
    implementation libs.composeUiToolingPreview
    implementation libs.lifecycleViewmodelCompose
    implementation libs.lifecycleRuntimeCompose

    implementation libs.documentfile
}