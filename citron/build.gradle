plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.citron.citron_emu'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        minSdk 26
        ndk {
            abiFilters 'arm64-v8a'
        }
        buildConfigField 'String', 'APPLICATION_ID', '"org.citron.citron_emu.wn"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // The 12 Switch native libs (libcitron-android + FFmpeg + adrenotools hooks) are
    // NOT bundled into the APK. They ship inside the Retro-Consoles bundle under
    // `data/citron/jniLibs/` and are extracted at runtime, then loaded directly via
    // System.load (see CitronBootstrap). Drop the jniLibs source set so they are no
    // longer packaged.
    sourceSets {
        main {
            jniLibs.srcDirs = []
        }
    }
}

dependencies {
    implementation libs.coreKtx
    implementation libs.appcompat
    implementation libs.activityKtx
}
